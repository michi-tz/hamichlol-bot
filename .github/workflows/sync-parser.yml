name: Sync parser from upstream
# Regenerates src/parser from the latest commit of EladHeller/wiki-bot
# (npm run sync:parser -- --latest) and opens a pull request when it changed.
#
# Needs the repository setting Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests", otherwise `gh pr create` is refused.
# Pull requests opened with the built-in GITHUB_TOKEN do not trigger other workflows (CI.yml
# will not run on them), which is why this workflow runs lint and tests itself and reports
# the result in the pull request title and body.
on:
  schedule:
    - cron: 23 4 * * 1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-parser
  cancel-in-progress: false

jobs:
  sync-parser:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: npm ci

      - name: Sync with upstream head
        id: sync
        run: |
          old_sha=$(jq -r .commit src/parser/upstream.json)
          npm run sync:parser -- --latest
          new_sha=$(jq -r .commit src/parser/upstream.json)
          repo=$(jq -r .repo src/parser/upstream.json)
          {
            echo "old_sha=$old_sha"
            echo "new_sha=$new_sha"
            echo "branch=sync/parser-${new_sha:0:7}"
            echo "compare_url=${repo%.git}/compare/$old_sha...$new_sha"
            if [ -n "$(git status --porcelain)" ]; then echo "changed=true"; else echo "changed=false"; fi
          } >> "$GITHUB_OUTPUT"
          git status --short

      # Only an existing pull request (open, merged or closed) means this upstream commit was
      # handled. A leftover branch without one (e.g. a run that pushed but could not open the
      # pull request) is not: the branch is overwritten below and the pull request is opened.
      - name: Skip if a pull request already exists for this upstream commit
        id: existing
        if: steps.sync.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          prs=$(gh pr list --head "$BRANCH" --state all --json number --jq '.[].number')
          if [ -n "$prs" ]; then
            echo "A pull request from $BRANCH already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint and test
        id: checks
        if: steps.sync.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        run: |
          status=passed
          npm run lint:test > "$RUNNER_TEMP/lint.log" 2>&1 || status=failed
          npm test -- --no-coverage > "$RUNNER_TEMP/test.log" 2>&1 || status=failed
          cat "$RUNNER_TEMP/lint.log" "$RUNNER_TEMP/test.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
          OLD_SHA: ${{ steps.sync.outputs.old_sha }}
          NEW_SHA: ${{ steps.sync.outputs.new_sha }}
          COMPARE_URL: ${{ steps.sync.outputs.compare_url }}
          STATUS: ${{ steps.checks.outputs.status }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A src/parser
          git commit -m "Sync parser with wiki-bot ${NEW_SHA:0:7}" -m "Upstream changes: $COMPARE_URL"
          git push --force origin "$BRANCH"

          title="Sync parser with wiki-bot ${OLD_SHA:0:7}..${NEW_SHA:0:7}"
          if [ "$STATUS" = "passed" ]; then
            result="Lint and tests **passed**."
          else
            title="[FAILING] $title"
            result="**Lint or tests FAILED** after the sync. Adapt our code/tests (or the sync) on this branch before merging."
          fi
          {
            echo "Automated sync of \`src/parser\` with [EladHeller/wiki-bot](${COMPARE_URL%/compare/*})"
            echo "from \`$OLD_SHA\` to \`$NEW_SHA\`."
            echo
            echo "Upstream changes: $COMPARE_URL"
            echo
            echo "$result"
            echo
            echo "Generated by \`npm run sync:parser -- --latest\` (workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo "This pull request was opened with GITHUB_TOKEN, so CI does not run on it; the results above come from the sync workflow."
            if [ "$STATUS" != "passed" ]; then
              echo
              echo "<details><summary>Lint output (last 50 lines)</summary>"
              echo
              echo '~~~'
              tail -n 50 "$RUNNER_TEMP/lint.log"
              echo '~~~'
              echo "</details>"
              echo
              echo "<details><summary>Test output (last 100 lines)</summary>"
              echo
              echo '~~~'
              tail -n 100 "$RUNNER_TEMP/test.log"
              echo '~~~'
              echo "</details>"
            fi
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
